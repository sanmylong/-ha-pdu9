name: Validate

on:
  push:
  pull_request:
  schedule:
    # HA 每月都在改 API，定时跑一次能在用户升级 HA 之前先发现问题。
    - cron: "0 3 * * 1"

jobs:
  hassfest:
    name: hassfest（HA 官方清单校验）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: home-assistant/actions/hassfest@master

  hacs:
    name: HACS 仓库结构校验
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hacs/action@main
        with:
          category: integration
